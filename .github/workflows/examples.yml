name: Current learning examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install system audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libportaudio2
      - name: Install locked Python environment
        run: |
          python -m pip install uv
          uv sync --locked --python '${{ matrix.python }}' --extra audio --extra ai --extra database
      - name: Check current examples
        run: |
          uv run --no-sync ruff check
          uv run --no-sync ruff format --check
          uv run --no-sync pytest
          uv run --no-sync python -m compileall -q -x '(^|/)(\.venv|\.git|target|dist)/' .
          uv build
      - name: Build and test native DSP
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo test --manifest-path rust_audio/Cargo.toml
          uv pip install ./rust_audio
          uv run --no-sync python -c 'import rusty_audio'
          uv run --no-sync pytest tests/test_native.py
      - name: Exercise native WAV producer
        run: |
          mkdir -p output
          cargo run --release --manifest-path rust_audio/Cargo.toml --bin render -- output/rust-tone.wav
          uv run --no-sync python -m audio_lab.native output/native.wav
          uv run --no-sync python -m audio_lab export output/native.wav output/native.mp3